name: IA abre PR a partir de issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ia-abre-pr:
    if: github.event.label.name == 'ia-corrigir'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci

      - name: IA altera o código
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: node scripts/ia-corrige-issue.js

      - name: Validar a mudança (lint + testes + cobertura)
        id: validacao
        continue-on-error: true
        run: |
          npm run lint
          npm run coverage

      - name: Abrir PR
        run: |
          RESUMO=$(cat ia-resumo.txt)
          rm ia-resumo.txt
          STATUS="${{ steps.validacao.outcome == 'success' && 'passaram' || 'FALHARAM (revisar antes do merge)' }}"
          BRANCH="ia/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add web test
          git commit -m "feat: proposta da IA para a issue #$ISSUE_NUMBER"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "IA: $ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUMBER

          $RESUMO

          Lint, testes e cobertura rodados antes do commit: **$STATUS**.
          Gerado pelo modelo openai/gpt-oss-20b (Groq). Precisa de revisão humana antes do merge."

name: IA analisando traces

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analisar-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa traces
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          TRACE=$(cat traces/conversion_trace.txt | tr '\n' ' ')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d '{
              "model": "openai/gpt-oss-20b",
              "messages": [
                {
                  "role": "system",
                  "content": "Você é especialista em distributed tracing."
                },
                {
                  "role": "user",
                  "content": "Analise este trace de uma aplicação web de conversão de temperatura e identifique gargalos: '"$TRACE"'"
                }
              ]
            }')
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; \
          r=json.load(sys.stdin); print(r['choices'][0]['message']['content'])")
          echo "$DECISION"
          echo "### Análise de traces" >> "$GITHUB_STEP_SUMMARY"
          echo "$DECISION" >> "$GITHUB_STEP_SUMMARY"
          if echo "$DECISION" | grep -qiE "timeout|gargalo|crítico|critico"; then
            gh issue create \
              --title "Gargalo detectado em trace distribuído" \
              --body "$DECISION"
            exit 1
          fi

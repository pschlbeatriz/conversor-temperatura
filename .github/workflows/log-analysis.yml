name: IA analisando logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v7

      # Camada 1: regra fixa. Nenhum texto no log consegue convencê-la.
      - name: Regra fixa (não depende da IA)
        id: regra
        run: |
          if grep -qE '^(CRITICAL|FATAL)' logs/app.log; then
            echo "critico=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Regra fixa: há linha CRITICAL ou FATAL no log"
          else
            echo "critico=false" >> "$GITHUB_OUTPUT"
          fi

      # Camada 2: a IA analisa o contexto e explica
      - name: IA analisa logs (ia_decisao.sh)
        id: ia
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          TAREFA: >-
            Análise de logs de um conversor de temperatura. Existe algum erro crítico
            (linhas CRITICAL ou FATAL) que exija ação imediata?
          ARQUIVO_DADOS: logs/app.log
          OPCOES: CRITICO NORMAL
          OPCAO_SEGURA: CRITICO
        run: bash scripts/ia_decisao.sh

      - name: Decisão final
        env:
          REGRA: ${{ steps.regra.outputs.critico }}
          DECISAO: ${{ steps.ia.outputs.decisao }}
        run: |
          {
            echo "### Decisão final"
            echo "- Regra fixa encontrou CRITICAL/FATAL: **$REGRA**"
            echo "- Decisão da IA: **$DECISAO**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REGRA" = "true" ] || [ "$DECISAO" != "NORMAL" ]; then
            echo "::error::Logs com problema crítico (regra fixa: $REGRA, IA: $DECISAO)"
            exit 1
          fi
